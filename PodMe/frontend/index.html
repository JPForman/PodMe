<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PodMe Veterinary Care - compassionate wellness exams, vaccinations, dental care, and emergency support for your pets."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>PodMe Veterinary Care</title>
    <script>
      // Apply a saved theme choice before first paint, so the page never flashes
      // the wrong theme while the React app boots.
      // NOTE: firebase.json's CSP allows this exact script via a sha256 hash.
      // Editing this script's text invalidates that hash and CSP will block it —
      // recompute with: openssl dgst -sha256 -binary <script text> | openssl base64
      try {
        var savedTheme = localStorage.getItem('theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
